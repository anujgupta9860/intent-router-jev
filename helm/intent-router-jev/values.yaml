# Default values for intent-router-jev.
# This is a starting point for local/dev; copy to your own values file
# (or use values-example.yaml) for GKE.

replicaCount: 1

image:
  repository: intent-router-jev
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

# Non-secret configuration -> rendered into a ConfigMap.
config:
  classifierBackend: "mock"      # mock | jev
  jevModel: "jev-1.13.0"         # pin a version; jev-latest moves
  jevApiUrl: "https://api.typesafe.ai/v1/systemone"
  jevTimeoutS: "10"
  confidenceThreshold: 0.6
  humanReviewThreshold: 0.5
  logLevel: "INFO"
  # intent -> worker agent A2A base URL. "fallback" is required.
  workerAgents:
    billing_inquiry: "http://billing-worker:8001"
    technical_support: "http://billing-worker:8001"
    sales_question: "http://billing-worker:8001"
    account_update: "http://order-worker:8002"
    order_status: "http://order-worker:8002"
    fallback: "http://order-worker:8002"

# Secret configuration -> rendered into a Secret. Prefer kubectl-created
# secrets or External Secrets in production (see templates/NOTES.txt).
secrets:
  create: true
  typesafeApiKey: ""            # base64 is NOT needed; stringData handles it

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

nodeSelector: {}
tolerations: []
affinity: {}
