{{- /*
Secret with a lookup guard: on `helm upgrade`, if the Secret already exists
(e.g. created by kubectl or a previous release), we do NOT recreate it, so
an upgrade can never blank out or regenerate existing secret values.
*/ -}}
{{- if .Values.secrets.create }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "intent-router-jev.fullname" .) }}
{{- if not $existing }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "intent-router-jev.fullname" . }}
  labels:
    {{- include "intent-router-jev.labels" . | nindent 4 }}
type: Opaque
stringData:
  TYPESAFE_API_KEY: {{ .Values.secrets.typesafeApiKey | quote }}
{{- end }}
{{- end }}
