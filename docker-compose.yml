# Local demo: router + two stub worker agents.
#   docker compose up --build
# Router on http://localhost:8080, workers on :8001 / :8002.
# For live Jev: export TYPESAFE_API_KEY first, then uncomment the two
# CLASSIFIER_BACKEND lines (or pass -e CLASSIFIER_BACKEND=jev).
services:
  router:
    build: .
    ports:
      - "8080:8080"
    environment:
      CLASSIFIER_BACKEND: mock   # -> jev for the live API
      # TYPESAFE_API_KEY: ${TYPESAFE_API_KEY}
      TYPESAFE_MODEL: jev-1.13.0
      WORKER_AGENTS_JSON: '{"billing_inquiry":"http://worker-a:8001","technical_support":"http://worker-a:8001","sales_question":"http://worker-a:8001","account_update":"http://worker-b:8002","order_status":"http://worker-b:8002","fallback":"http://worker-b:8002"}'
    depends_on:
      - worker-a
      - worker-b

  worker-a:
    build: .
    command: ["uvicorn", "src.workers.stub_worker:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      WORKER_NAME: worker-a

  worker-b:
    build: .
    command: ["uvicorn", "src.workers.stub_worker:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      WORKER_NAME: worker-b
